name: OpsDesk validation

on:
  pull_request:
  push:
    branches: [main, 'feat/opsdesk-*', 'docs/opsdesk-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opsdesk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep the image version aligned with package.json's exact Playwright version.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: opsdesk-ci-only
          POSTGRES_DB: opsdesk
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U opsdesk -d opsdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.x'
          cache: npm
      - run: npm ci
      - run: node --test scripts/booking-export.test.mjs
      - name: Check offline classifier regressions
        run: |
          npm run ops:evaluate-classifier -- --check
          npm run ops:evaluate-classifier -- --holdout --check
      - name: Configure isolated database
        env:
          OPSDESK_CI_DATABASE_URL: postgresql://opsdesk:opsdesk-ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/opsdesk
        run: |
          npm run ops:setup
          node --input-type=module -e "import fs from 'node:fs'; const p='backend/.env'; fs.writeFileSync(p, fs.readFileSync(p,'utf8').replace(/^DATABASE_URL=.*$/m, 'DATABASE_URL=' + process.env.OPSDESK_CI_DATABASE_URL));"
      - name: Build and start isolated demo
        run: |
          node scripts/run-local.mjs --preview --external-db > opsdesk-ci.log 2>&1 &
          preview_pid=$!
          ready=false
          for attempt in $(seq 1 240); do
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            web_status=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000 || true)
            api_status=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3001/ops/workspace?compact=1' || true)
            ready_status=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/health/ready || true)
            worker_status=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/health/worker || true)
            if [ "$web_status" = 200 ] && [ "$api_status" = 401 ] && [ "$ready_status" = 200 ] && [ "$worker_status" = 200 ]; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat opsdesk-ci.log; exit 1; fi
      - run: node --test scripts/recovery-safety.test.mjs
      - name: Rehearse isolated logical recovery
        env:
          OPSDESK_RECOVERY_DATABASE_URL: postgresql://opsdesk:opsdesk-ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          OPSDESK_RECOVERY_CONTAINER: ${{ job.services.postgres.id }}
        run: npm run ops:recovery
      - run: npm run ops:test
      - run: node scripts/booking-ownership.integration.mjs
      - name: Synthetic five-role load smoke
        env:
          OPSDESK_LOAD_IDENTITIES: expanded
          OPSDESK_LOAD_ROLE_WEIGHTS: '{"manager":1,"agency":1,"customer":1,"agent":1,"supplier":1}'
        run: npm run ops:load
      - name: Synthetic API process-start smoke
        env:
          OPSDESK_STARTUP_DATABASE_URL: postgresql://opsdesk:opsdesk-ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          OPSDESK_STARTUP_ROLES: manager,supplier,supplier-history
          OPSDESK_STARTUP_ROUNDS: '1'
          OPSDESK_STARTUP_REPEATS: '2'
        run: npm run ops:startup-profile
      - name: Pull preinstalled browser runtime
        timeout-minutes: 5
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Chromium workspace smoke
        timeout-minutes: 6
        # Host networking preserves the synthetic API/database loopback guards.
        # Mount setup-node's binary so browser fixtures still use Node 22.23.x.
        run: |
          docker run --rm --init --network host --ipc host \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$(command -v node):/usr/local/bin/node:ro" \
            --workdir /workspace --env CI=true \
            --env OPSDESK_BROWSER_ENGINE=chromium \
            "$PLAYWRIGHT_IMAGE" sh -c 'node --version && npm run ops:test:browser'
      - name: Firefox workspace smoke
        timeout-minutes: 6
        run: |
          docker run --rm --init --network host --ipc host \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$(command -v node):/usr/local/bin/node:ro" \
            --workdir /workspace --env CI=true \
            --env OPSDESK_BROWSER_ENGINE=firefox \
            "$PLAYWRIGHT_IMAGE" sh -c 'node --version && npm run ops:test:browser'
      - run: npm audit --omit=dev
      - name: Show startup diagnostics
        if: failure()
        run: cat opsdesk-ci.log 2>/dev/null || true
